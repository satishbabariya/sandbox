name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build and test
    # Apple silicon: sandbox targets Virtualization.framework on arm64 and
    # will not build on the Intel runners. The runner must also be macOS 26 --
    # Package.swift declares that as its minimum, so an older image cannot
    # build this at all.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The pinned gvisor-tap-vsock revision declares go 1.25.6 in its
          # go.mod, so anything older cannot build the gateway at all.
          go-version: ">=1.25.6"
          # There is no go.sum here to key a cache on: the Go tree is fetched
          # at the pinned SHA into netstack/.work during the build. Left on,
          # the action warns that it cannot find one, which reads as a fault
          # rather than as a repository that has no Go module of its own.
          cache: false

      # The gateway binary, which one Swift test boots for real to check it
      # answers DHCP over the same socket the VM's NIC is bound to. Without it
      # that test reports "gvsandbox not built" and fails the job.
      #
      # Building rather than `make -C netstack test`: the test target runs the
      # Go suites, which the gateway job already does, and never produces the
      # binary -- so the Swift test kept failing while the step passed.
      - name: Build the gateway
        run: make -C netstack
      
      # Selecting the newest installed Xcode rather than pinning a path, which
      # the runner images move between releases.
      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi

      - name: Show toolchain
        run: swift --version && sw_vers && xcodebuild -version

      # v4 targets Node 20, which the runners now force onto Node 24 and warn
      # about on every run. The other actions here were moved to v7 already;
      # this was the one left.
      - uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check formatting
        run: |
          swift format lint --recursive --strict Sources Tests \
            || { echo "run: swift format --in-place --recursive Sources Tests"; exit 1; }

  gateway:
    name: Gateway build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The pinned gvisor-tap-vsock revision declares go 1.25.6 in its
          # go.mod, so anything older cannot build the gateway at all.
          go-version: ">=1.25.6"
          # There is no go.sum here to key a cache on: the Go tree is fetched
          # at the pinned SHA into netstack/.work during the build. Left on,
          # the action warns that it cannot find one, which reads as a fault
          # rather than as a repository that has no Go module of its own.
          cache: false

      # Builds gvisor-tap-vsock at the pinned SHA with our patches, then runs
      # the policy, broker, DNS, and forwarder suites. Also fails if the Swift
      # and Go policy matchers have drifted apart.
      - name: Apply patches and test
        run: make -C netstack test

  vectors:
    name: Policy matcher conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The pinned gvisor-tap-vsock revision declares go 1.25.6 in its
          # go.mod, so anything older cannot build the gateway at all.
          go-version: ">=1.25.6"
          # There is no go.sum here to key a cache on: the Go tree is fetched
          # at the pinned SHA into netstack/.work during the build. Left on,
          # the action warns that it cannot find one, which reads as a fault
          # rather than as a repository that has no Go module of its own.
          cache: false
      - name: Swift and Go matchers must agree
        run: make -C netstack check-vectors

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh
