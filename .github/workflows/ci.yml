name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build and test
    # Apple silicon: airlock targets Virtualization.framework on arm64 and
    # will not build on the Intel runners. The runner must also be macOS 26 --
    # Package.swift declares that as its minimum, so an older image cannot
    # build this at all.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The pinned gvisor-tap-vsock revision declares go 1.25.6 in its
          # go.mod, so anything older cannot build the gateway at all.
          go-version: ">=1.25.6"

      # Builds gvisor-tap-vsock at the pinned SHA with our patches, then runs
      # the policy, broker, DNS, and forwarder suites. Also fails if the Swift
      # and Go policy matchers have drifted apart.
      - name: Apply patches and test
        run: make -C netstack test
      
      # Selecting the newest installed Xcode rather than pinning a path, which
      # the runner images move between releases.
      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi

      - name: Show toolchain
        run: swift --version && sw_vers && xcodebuild -version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check formatting
        run: |
          swift format lint --recursive --strict Sources Tests \
            || { echo "run: swift format --in-place --recursive Sources Tests"; exit 1; }

  gateway:
    name: Gateway build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The pinned gvisor-tap-vsock revision declares go 1.25.6 in its
          # go.mod, so anything older cannot build the gateway at all.
          go-version: ">=1.25.6"

      # Builds gvisor-tap-vsock at the pinned SHA with our patches, then runs
      # the policy, broker, DNS, and forwarder suites. Also fails if the Swift
      # and Go policy matchers have drifted apart.
      - name: Apply patches and test
        run: make -C netstack test

  vectors:
    name: Policy matcher conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The pinned gvisor-tap-vsock revision declares go 1.25.6 in its
          # go.mod, so anything older cannot build the gateway at all.
          go-version: ">=1.25.6"
      - name: Swift and Go matchers must agree
        run: make -C netstack check-vectors

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh
