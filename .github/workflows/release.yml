name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi

      - uses: actions/setup-go@v7
        with:
          # The pinned gvisor-tap-vsock revision declares go 1.25.6 in its
          # go.mod, so anything older cannot build the gateway at all.
          go-version: ">=1.25.6"
          # No go.sum here to key a cache on; the Go tree is fetched at the
          # pinned SHA during the build.
          cache: false

      # The version baked into the binary must match the tag, or `sandbox
      # --version` lies about what a user is running.
      - name: Stamp version
        run: |
          V="${{ steps.version.outputs.value }}"
          sed -i '' "s|public static let current = \".*\"|public static let current = \"${V#v}\"|" \
            Sources/SandboxKit/Version.swift
          grep current Sources/SandboxKit/Version.swift

      # The gateway first: one Swift test boots the real gvsandbox to check it
      # answers DHCP, and `swift build` does not produce that binary. CI was
      # fixed for this and the release workflow was not, so the first tag
      # failed here -- after stamping the version, before publishing anything.
      - name: Build the gateway
        run: make -C netstack

      - name: Test
        run: |
          swift test
          make -C netstack test

      # `make package` also builds release and verifies the archive: that the
      # entitlement survived being copied and tarred, that the gateway is in
      # there, and that the binary runs. Defined in the Makefile rather than
      # here so it can be checked without cutting a tag.
      - name: Package
        run: make package VERSION="${{ steps.version.outputs.value }}"

      # The formula pins the source tarball GitHub generates for the tag, not
      # the binary archive above: a poured bottle would arrive without the
      # codesigned entitlement, so Homebrew has to build from source.
      - name: Stamp the Homebrew formula
        run: |
          V="${{ steps.version.outputs.value }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${V}.tar.gz"
          # Give the tag's tarball a moment to exist, then hash the bytes
          # Homebrew will actually download.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$URL" -o /tmp/src.tar.gz; then break; fi
            echo "source tarball not ready yet (attempt $attempt)"; sleep 10
          done
          SHA=$(shasum -a 256 /tmp/src.tar.gz | cut -d" " -f1)
          sed -i '' "s|^  url .*|  url \"${URL}\"|" packaging/sandbox.rb
          sed -i '' "s|^  sha256 .*|  sha256 \"${SHA}\"|" packaging/sandbox.rb
          grep -E "^  (url|sha256)" packaging/sandbox.rb
          cp packaging/sandbox.rb dist/

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/sandbox.rb
          body: |
            ## Install

            ```console
            $ tar -xzf sandbox-${{ steps.version.outputs.value }}-darwin-arm64.tar.gz
            $ sudo cp sandbox-*/bin/* /usr/local/bin/
            $ sandbox kernel install   # guest kernel, ~280 MiB, once
            $ sandbox doctor           # checks everything at once
            ```

            Then:

            ```console
            $ sandbox run shell --allow example.com
            ```

            Requires Apple silicon and macOS 26.

            The binary is signed ad-hoc with `com.apple.security.virtualization`,
            without which Virtualization refuses to start a VM at all. macOS
            quarantines anything downloaded through a browser, which strips it —
            `sandbox doctor` reports exactly that, and it is cleared with
            `xattr -d com.apple.quarantine /usr/local/bin/sandbox`.

            ## What changed

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.value }}/CHANGELOG.md).

            ## What this does and does not protect against

            The README is explicit about both, and the list of what it does not
            cover is worth reading before trusting it with anything.
